                        const pA = parseDateRange(a.scorecardDateRange);
                        const pB = parseDateRange(b.scorecardDateRange);
                        if (pA && pB) return pB.end.getTime() - pA.end.getTime();
                        return 0;
                    });
                    setSavedScorecards(cards);
                }, (error) => {
                    console.error("Firestore error:", error);
                    showToast("Failed to sync scorecards from cloud", "error");
                });
                
                return () => unsubscribe();
            }, [user]);

            useEffect(() => {
                function handleClickOutside(event) {
                    if (siteDropdownRef.current && !siteDropdownRef.current.contains(event.target)) setIsSiteDropdownOpen(false);
                    if (driverDropdownRef.current && !driverDropdownRef.current.contains(event.target)) setIsDriverDropdownOpen(false);
                }
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);

            useEffect(() => {
                if (window.XLSX) { setXlsxLoaded(true); }
            }, []);

            // Upload Wrappers
            const handleMainScorecardUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                processScorecardFile(file, (data, dateRangeStr) => {
                    setScorecardData(data);
                    setScorecardDateRange(dateRangeStr);
                    
                    const prevSc = getPreviousScorecard(dateRangeStr, savedScorecards);
                    if (prevSc) {
                        setTrendScorecardData(prevSc.scorecardData);
                        setTrendAssetData(prevSc.assetData || null);
                        setTrendDateRange(prevSc.scorecardDateRange);
                    } else {
                        setTrendScorecardData(null);
                        setTrendAssetData(null);
                        setTrendDateRange("");
                    }
                }, (errMsg) => showToast(errMsg, "error"));
                e.target.value = null;
            };

            const handleAssetUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                processAssetFile(file, 
                    (data) => setAssetData(data),
                    (errMsg) => showToast(errMsg, "error")
                );
                e.target.value = null;
            };

            // --- Process Data Pipelines ---
            const mergedData = useProcessedData(scorecardData, assetData);
            const trendMergedData = useProcessedData(trendScorecardData, trendAssetData);

            const filteredData = useFilteredData(mergedData, selectedRegion, selectedSites, selectedDrivers);
            const trendFilteredData = useFilteredData(trendMergedData, selectedRegion, selectedSites, selectedDrivers);

            const poolData = useMemo(() => {
                if (activeView === "dashboard" && scorecardData) return mergeData(scorecardData, assetData);
                if (activeView === "insights" && savedScorecards.length > 0) {
                    const latest = viewingPastId ? (savedScorecards.find(s => s.id === viewingPastId) || savedScorecards[0]) : savedScorecards[0];
                    return mergeData(latest.scorecardData, latest.assetData);
                }
                return [];
            }, [activeView, scorecardData, assetData, savedScorecards, viewingPastId]);

            const regions = ["All", ...new Set(poolData.map(d => d.region).filter(Boolean))].sort();

            const availableSites = useMemo(() => {
                let data = selectedRegion === "All" ? poolData : poolData.filter(d => d.region === selectedRegion);
                return [...new Set(data.map(d => d.group).filter(Boolean))].sort();
            }, [poolData, selectedRegion]);

            const availableDrivers = useMemo(() => {
                let data = selectedRegion === "All" ? poolData : poolData.filter(d => d.region === selectedRegion);
                if (selectedSites.length > 0) data = data.filter(d => selectedSites.includes(d.group));
                return [...new Set(data.map(d => d.fullName && d.fullName !== "N/A" ? d.fullName : d.email.split('@')[0]).filter(Boolean))].sort((a, b) => String(a || "").localeCompare(String(b || "")));
            }, [poolData, selectedRegion, selectedSites]);

            // Filter Handlers
            const toggleSite = (site) => setSelectedSites(prev => prev.includes(site) ? prev.filter(s => s !== site) : [...prev, site]);
            const toggleDriver = (driver) => setSelectedDrivers(prev => prev.includes(driver) ? prev.filter(d => d !== driver) : [...prev, driver]);
            const handleRegionChange = (e) => {
                setSelectedRegion(e.target.value);
                setSelectedSites([]);
                setSelectedDrivers([]);
            };

            // --- KPI Metrics ---
            const defaultMetrics = { totalMiles: 0, totalKm: 0, avgScore: 0, ha: 0, hb: 0, hc: 0, sb: 0, preM: 0, postM: 0 };
            const currentMetrics = useRegionMetrics(filteredData) || defaultMetrics;
            const pastMetrics = useRegionMetrics(trendFilteredData);

            const riskCounts = useMemo(() => {
                const counts = { "Low Risk": 0, "Mild Risk": 0, "Medium Risk": 0, "High Risk": 0 };
                filteredData.forEach(d => {
                    if (d.isActive && counts[d.scoringClass] !== undefined) counts[d.scoringClass]++;
                });
                return counts;
            }, [filteredData]);

            const totalActiveDrivers = Object.values(riskCounts).reduce((a, b) => a + b, 0);

            const topDrivers = useMemo(() => {
                return filteredData.filter(d => d.isActive).slice(0, 3);
            }, [filteredData]);

            const siteSummary = useMemo(() => calculateSiteSummary(filteredData, ragMode), [filteredData, ragMode]);

            const driverSummary = useMemo(() => {
                const getRAG = (pre, post) => {
                    if (pre === 0 || post === 0) return "Red";
                    if (Math.abs(pre - post) > 3) return "Red";
                    if (pre === post) return "Green";
                    return "Amber";
                };
                const calcRatio = (pre, post, isViolation = false) => {
                    if (pre === 0 && post === 0) return isViolation ? 0 : 1; 
                    if (pre === 0 || post === 0) return 0; 
                    return Math.min(pre, post) / Math.max(pre, post);
                };
                const getPercentRAG = (ratio) => {
                    if (ratio >= 0.98) return "Green";
                    if (ratio >= 0.95) return "Amber";
                    return "Red";
                };

                let totalPre = 0, totalPost = 0, totalDistMiles = 0, totalDistKm = 0;
                const rows = [];
                
                filteredData.forEach(d => {
                    if (d.preTrips === 0 && d.postTrips === 0 && d.distanceMiles === 0) return;
                    totalPre += d.preTrips; totalPost += d.postTrips; 
                    totalDistMiles += d.distanceMiles; totalDistKm += d.distanceKm;
                    
                    const violation = d.preTrips === 0 && d.postTrips === 0 && d.distanceMiles > 0;
                    const ratio = calcRatio(d.preTrips, d.postTrips, violation);
                    const activeRag = ragMode === 'percent' ? getPercentRAG(ratio) : getRAG(d.preTrips, d.postTrips);

                    rows.push({
                        driver: d.fullName && d.fullName !== "N/A" ? d.fullName : d.email.split('@')[0],
                        site: d.assetSite, pre: d.preTrips, post: d.postTrips,
                        distKm: d.distanceKm, distMiles: d.distanceMiles,
                        ratio, rag: activeRag, violation
                    });
                });

                if (ragMode === 'percent') {
                    rows.sort((a, b) => b.ratio - a.ratio || String(a.driver || "").localeCompare(String(b.driver || "")));
                } else {
                    const ragWeight = { "Green": 1, "Amber": 2, "Red": 3 };
                    rows.sort((a, b) => ragWeight[a.rag] - ragWeight[b.rag] || String(a.driver || "").localeCompare(String(b.driver || "")));
                }
                
                const totalViolation = totalPre === 0 && totalPost === 0 && totalDistMiles > 0;
                const totalRatio = calcRatio(totalPre, totalPost, totalViolation);
                const totalRag = ragMode === 'percent' ? getPercentRAG(totalRatio) : getRAG(totalPre, totalPost);

                return { rows, totalPre, totalPost, totalDistKm, totalDistMiles, totalRatio, totalRag };
            }, [filteredData, ragMode]);

            const handleCopyTable = (elementId) => {
                const table = document.getElementById(elementId);
                if (!table) return;
                const range = document.createRange();
                range.selectNode(table);
                window.getSelection().removeAllRanges();
                window.getSelection().addRange(range);
                try {
                    document.execCommand('copy');
                    showToast("Table copied to clipboard! Ready to paste into PowerPoint.");
                } catch (err) {
                    showToast("Failed to copy table. Please copy it manually.", "error");
                }
                window.getSelection().removeAllRanges();
            };

            const handleExportPDF = async () => {
                const el = document.getElementById("dashboard-content");
                if (!el) return;
                
                setIsExporting(true);
                const originalBg = el.style.backgroundColor;
                el.style.backgroundColor = '#f9fafb';
                
                try {
                    const canvas = await window.html2canvas(el, { 
                        scale: 1.5,
                        backgroundColor: '#f9fafb',
                        useCORS: true 
                    });
                    
                    el.style.backgroundColor = originalBg;
                    
                    const imgData = canvas.toDataURL('image/jpeg', 0.8); 
                    const pdfWidth = 210;
                    const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
                    
                    const pdf = new window.jspdf.jsPDF('p', 'mm', [pdfWidth, pdfHeight]);
                    pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
                    
                    let fileName = "Driver-Safety-Scorecard.pdf";
                    if (scorecardDateRange) {
                        fileName = `Driver-Safety-Scorecard_${scorecardDateRange.replace(/\s+/g, '')}.pdf`;
                    }
                    pdf.save(fileName);
                    showToast("PDF generated successfully.");
                } catch (e) {
                    console.error("PDF generation failed:", e);
                    showToast("Failed to export PDF.", "error");
                } finally {
                    setIsExporting(false);
                }
            };

            const handleSaveScorecard = async () => {
                if (!scorecardData) return;
                
                if (!user || !db) {
                    showToast("You are not connected to the cloud database.", "error");
                    return;
                }
                
                const newId = Date.now().toString();
                const newScorecard = {
                    scorecardDateRange,
                    scorecardData,
                    assetData,
                    timestamp: new Date().toISOString(),
                    createdBy: user.uid
                };

                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'scorecards', newId);
                    await setDoc(docRef, newScorecard);
                    setViewingPastId(newId);
                    showToast("Scorecard saved to the cloud successfully! Everyone with the link can now see it.");
                } catch(e) {
                    console.error("Error saving:", e);
                    showToast("Error saving to cloud.", "error");
                }
            };

            const handleLoadScorecard = (sc) => {
                setScorecardData(sc.scorecardData);
                setAssetData(sc.assetData || null);
                setScorecardDateRange(sc.scorecardDateRange || "");
                
                const prevSc = getPreviousScorecard(sc.scorecardDateRange, savedScorecards, sc.id);
                if (prevSc) {
                    setTrendScorecardData(prevSc.scorecardData);
                    setTrendAssetData(prevSc.assetData || null);
                    setTrendDateRange(prevSc.scorecardDateRange);
                } else {
                    setTrendScorecardData(null);
                    setTrendAssetData(null);
                    setTrendDateRange("");
                }

                setSelectedRegion("All");
                setSelectedSites([]);
                setSelectedDrivers([]);
                setViewingPastId(sc.id);
            };

            const handleAddNewScorecard = () => {
                setScorecardData(null);
                setAssetData(null);
                setScorecardDateRange("");
                setTrendScorecardData(null);
                setTrendAssetData(null);
                setTrendDateRange("");
                setViewingPastId(null);
                setSelectedRegion("All");
                setSelectedSites([]);
                setSelectedDrivers([]);
                setActiveView("dashboard");
            };

            const handleDeleteScorecard = (id, e) => {
                e.stopPropagation(); 
                setConfirmDialog({
                    message: "Are you sure you want to permanently delete this scorecard from the cloud for everyone?",
                    onConfirm: async () => {
                        try {
                            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'scorecards', id);
                            await deleteDoc(docRef);
                            showToast("Scorecard deleted from cloud.");
                            if (viewingPastId === id) handleAddNewScorecard();
                        } catch(err) {
                            console.error(err);
                            showToast("Failed to delete scorecard.", "error");
                        }
                    }
                });
            };

            const handleExportBackup = () => {
                if (savedScorecards.length === 0) {
                    showToast("No saved scorecards to backup.", "error");
                    return;
                }
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(savedScorecards));
                const a = document.createElement('a');
                a.setAttribute("href", dataStr);
                const dateStr = new Date().toISOString().split('T')[0];
                a.setAttribute("download", `Fleet_Dashboard_Backup_${dateStr}.json`);
                document.body.appendChild(a);
                a.click();
                a.remove();
            };

            const handleImportBackup = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                if (!user || !db) {
                    showToast("Not connected to cloud to perform import.", "error");
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const importedData = JSON.parse(evt.target.result);
                        if (!Array.isArray(importedData)) throw new Error("Invalid format");
                        
                        let successCount = 0;
                        for (const sc of importedData) {
                            if (!sc.id) continue;
                            const docId = sc.id.toString();
                            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'scorecards', docId);
                            await setDoc(docRef, sc);
                            successCount++;
                        }
                        
                        showToast(`Successfully imported ${successCount} scorecards to the cloud!`);
                    } catch(err) {
                        console.error(err);
                        showToast("Error importing backup. Please ensure you selected a valid JSON backup file.", "error");
                    }
                };
                reader.readAsText(file);
                e.target.value = null;
            };

            const groupedSavedScorecards = useMemo(() => {
                const groups = {};

                savedScorecards.forEach(sc => {
                    const parsed = parseDateRange(sc.scorecardDateRange);
                    let groupName = "Unknown Period";
                    let sortValue = 0;
                    
                    if (parsed) {
                        if (parsed.type === 'year') {
                            groupName = `Yearly Reports ${parsed.year}`;
                            sortValue = parsed.year * 100 + 12;
                        } else {
                            const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
                            const endMonthName = months[parsed.end.getMonth()];
                            groupName = `${endMonthName} ${parsed.end.getFullYear()}`;
                            sortValue = parsed.end.getFullYear() * 100 + parsed.end.getMonth();
                        }
                    }
                    
                    if (!groups[groupName]) {
                        groups[groupName] = { name: groupName, sortValue, cards: [] };
                    }
                    groups[groupName].cards.push(sc);
                });

                const sortedGroups = Object.values(groups).sort((a, b) => b.sortValue - a.sortValue);

                sortedGroups.forEach(group => {
                    group.cards.sort((a, b) => {
                        const pA = parseDateRange(a.scorecardDateRange);
                        const pB = parseDateRange(b.scorecardDateRange);
                        if (pA && pB) {
                            const typeRank = { 'year': 4, 'quarter': 3, 'month': 2, 'partial': 1 };
                            const rankA = typeRank[pA.type] || 0;
                            const rankB = typeRank[pB.type] || 0;
                            
                            if (rankA !== rankB) return rankB - rankA;
                            return pB.end.getTime() - pA.end.getTime();
                        }
                        return 0;
                    });
                });

                return sortedGroups.map(g => ({ monthYear: g.name, cards: g.cards }));
            }, [savedScorecards]);

            const getRagColor = (rag) => {
                if (rag === "Red") return "#FF6666";
                if (rag === "Amber") return "#FFC000";
                if (rag === "Green") return "#92D050";
                return "#ffffff";
            };

            const globalActiveDrivers = useMemo(() => {
                if (activeView === "dashboard" && scorecardData) {
                    return filteredData.filter(d => d.isActive).length;
                }
                if (activeView === "insights" && savedScorecards.length > 0) {
                    const target = viewingPastId ? (savedScorecards.find(s => s.id === viewingPastId) || savedScorecards[0]) : savedScorecards[0];
                    if (!target) return 0;
                    const m = mergeData(target.scorecardData, target.assetData);
                    return getFilteredDataRaw(m, selectedRegion, selectedSites, selectedDrivers).filter(d => d.isActive).length;
                }
                return 0;
            }, [activeView, scorecardData, filteredData, savedScorecards, viewingPastId, selectedRegion, selectedSites, selectedDrivers]);

            return (
                <div className="min-h-screen p-6 flex justify-center relative">

                    {toast && (

                            {toast.message}
                        </div>

                    {confirmDialog && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center animate-in fade-in">

                                <h3 className="text-lg font-bold text-gray-900 mb-2">Are you sure?</h3>
                                <p className="text-gray-600 text-sm mb-6">{confirmDialog.message}</p>
                                <div className="flex gap-3 justify-end">
                                    <button onClick={() => setConfirmDialog(null)} className="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-bold rounded-lg transition-colors">Cancel</button>
                                    <button onClick={() => { confirmDialog.onConfirm(); setConfirmDialog(null); }} className="px-4 py-2 bg-red-600 hover:bg-red-700 text-white text-sm font-bold rounded-lg transition-colors">Yes, Delete</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="flex flex-col lg:flex-row w-full max-w-[1600px] gap-6">
                        
                        {/* --- SIDEBAR: PAST SCORECARDS --- */}
                        <div className="w-full lg:w-80 flex-shrink-0 flex flex-col space-y-4">
                            <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 sticky top-6 max-h-[90vh] overflow-y-auto">
                                
                                {/* Sidebar Header */}
                                <div className="flex flex-col border-b border-gray-100 pb-4 mb-4 gap-3">
                                    <div className="flex items-center gap-3">
                                        <History className="w-6 h-6 text-indigo-600" />
                                        <h2 className="text-lg font-bold text-gray-900">Cloud Scorecards</h2>
                                    </div>
                                    <div className="flex gap-2">
                                        <label className="cursor-pointer flex-1 flex justify-center items-center gap-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 px-2 py-2 rounded-lg text-xs font-bold transition-colors">
                                            <UploadIcon className="w-3.5 h-3.5" />
                                            Import
                                            <input type="file" accept=".json" onChange={handleImportBackup} className="hidden" />
                                        </label>
                                        <button 
                                            onClick={handleExportBackup} 
                                            className="flex-1 flex justify-center items-center gap-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 px-2 py-2 rounded-lg text-xs font-bold transition-colors"
                                        >
                                            <DownloadIcon className="w-3.5 h-3.5" />
                                            Export
                                        </button>
                                    </div>
                                    
                                    <button 
                                        onClick={() => setActiveView(activeView === "insights" ? "dashboard" : "insights")}
                                        className={`w-full flex justify-center items-center gap-1.5 px-2 py-2.5 rounded-lg text-xs font-bold transition-all shadow-sm
                                            ${activeView === 'insights' ? 'bg-purple-600 text-white hover:bg-purple-700' : 'bg-purple-100 hover:bg-purple-200 text-purple-700'}`}
                                    >
                                        {activeView === "insights" ? <DashboardIcon className="w-4 h-4" /> : <LineChartIcon className="w-4 h-4" />}
                                        {activeView === "insights" ? "Back to Dashboard" : "Insights & Trends"}
                                    </button>
                                </div>
                                
                                {loadingFirebase ? (
                                    <div className="text-center py-10 px-4">
                                        <Cloud className="w-10 h-10 text-gray-300 mx-auto mb-2 animate-pulse" />
                                        <p className="text-sm text-gray-500">Connecting to cloud...</p>
                                    </div>
                                ) : savedScorecards.length === 0 ? (
                                    <div className="text-center py-10 px-4">
                                        <FileText className="w-10 h-10 text-gray-200 mx-auto mb-2" />
                                        <p className="text-sm text-gray-500">No cloud scorecards yet.</p>
                                        <p className="text-xs text-gray-400 mt-1">Click "Save Scorecard" when you generate a report to sync it here.</p>
                                    </div>
                                ) : (
                                    <div className="space-y-6">
                                        {groupedSavedScorecards.map((group) => (
                                            <div key={group.monthYear} className="space-y-3 pt-1">
                                                <h3 className="text-xs font-black text-white uppercase tracking-wider sticky top-0 bg-gray-900 py-1.5 px-3 rounded-md shadow-sm z-10">{group.monthYear}</h3>
                                                <div className="space-y-2">
                                                    {group.cards.map(sc => {
                                                        const parsed = parseDateRange(sc.scorecardDateRange);
                                                        const isGold = parsed && (parsed.type === 'month' || parsed.type === 'year');
                                                        const isGreen = parsed && parsed.type === 'quarter';
                                                        
                                                        let bgClass = "bg-gray-50 hover:bg-indigo-50";
                                                        let borderClass = "border-gray-100 hover:border-indigo-200";
                                                        let ringClass = "";
                                                        let textClass = "text-gray-800";
                                                        
                                                        if (isGold) {
                                                            bgClass = "bg-yellow-50 hover:bg-yellow-100";
                                                            borderClass = "border-yellow-300 hover:border-yellow-400";
                                                            textClass = "text-yellow-900";
                                                        } else if (isGreen) {
                                                            bgClass = "bg-green-50 hover:bg-green-100";
                                                            borderClass = "border-green-400 hover:border-green-500";
                                                            textClass = "text-green-900";
                                                        }
                                                        
                                                        if (viewingPastId === sc.id) {
                                                            if (isGold) {
                                                                bgClass = "bg-yellow-100";
                                                                borderClass = "border-yellow-500";
                                                                ringClass = "shadow-sm ring-1 ring-yellow-500";
                                                            } else if (isGreen) {
                                                                bgClass = "bg-green-100";
                                                                borderClass = "border-green-600";
                                                                ringClass = "shadow-sm ring-1 ring-green-600";
                                                            } else {
                                                                bgClass = "bg-indigo-50";
                                                                borderClass = "border-indigo-200";
                                                                ringClass = "shadow-sm ring-1 ring-indigo-500";
                                                            }
                                                        }
                                                        
                                                        const className = `group flex flex-col rounded-lg p-3 cursor-pointer transition-all border ${bgClass} ${borderClass} ${ringClass}`;

                                                        return (
                                                            <div 
                                                                key={sc.id} 
                                                                onClick={() => handleLoadScorecard(sc)}
                                                                className={className}
                                                            >
                                                                <div className="flex justify-between items-start">
                                                                    <div className="flex-1 min-w-0 pr-2">
                                                                        <p className={`text-xs font-bold leading-tight ${textClass}`}>
                                                                            {formatDisplayRange(sc.scorecardDateRange)}
                                                                        </p>
                                                                        {sc.trendDateRange && (
                                                                            <p className="text-[10px] text-gray-500 mt-1 truncate">
                                                                                vs {formatDisplayRange(sc.trendDateRange).replace("Month of ", "").replace("Year of ", "")}
                                                                            </p>
                                                                        )}
                                                                    </div>
                                                                    <button 
                                                                        onClick={(e) => handleDeleteScorecard(sc.id, e)}
                                                                        className="text-gray-400 hover:text-red-500 transition-colors p-1"
                                                                        title="Delete Scorecard"
                                                                    >
                                                                        <Trash2 className="w-4 h-4" />
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* --- MAIN CONTENT --- */}
                        <div className="flex-1 min-w-0 flex flex-col h-full overflow-hidden">
                            <main className="flex-1 overflow-y-auto pb-10 custom-scrollbar">
                                <div className="space-y-6">
                                    
                                    {/* GLOBAL FILTER BAR */}
                                    {((activeView === "dashboard" && scorecardData) || (activeView === "insights" && savedScorecards.length > 0)) && (
                                        <FilterBar 
                                            regions={regions}
                                            availableSites={availableSites}
                                            availableDrivers={availableDrivers}
                                            selectedRegion={selectedRegion}
                                            handleRegionChange={handleRegionChange}
                                            selectedSites={selectedSites}
                                            toggleSite={toggleSite}
                                            setSelectedSites={setSelectedSites}
                                            selectedDrivers={selectedDrivers}
                                            toggleDriver={toggleDriver}
                                            setSelectedDrivers={setSelectedDrivers}
                                            activeDriversCount={globalActiveDrivers}
                                            siteDropdownRef={siteDropdownRef}
                                            isSiteDropdownOpen={isSiteDropdownOpen}
                                            setIsSiteDropdownOpen={setIsSiteDropdownOpen}
                                            driverDropdownRef={driverDropdownRef}
                                            isDriverDropdownOpen={isDriverDropdownOpen}
                                            setIsDriverDropdownOpen={setIsDriverDropdownOpen}
                                        />
                                    )}

                                    {activeView === "insights" ? (
                                        <InsightsView 
                                            savedScorecards={savedScorecards} 
                                            viewingPastId={viewingPastId}
                                            selectedRegion={selectedRegion}
                                            selectedSites={selectedSites}
                                            selectedDrivers={selectedDrivers}
                                        />
                                    ) : (
                                        <div className="space-y-6">
                                            
                                            {/* Header & Upload Section */}
                                            <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 flex flex-col xl:flex-row justify-between items-start xl:items-center gap-6">
                                                <div className="flex-1 w-full flex justify-between items-start">
                                                    <div>
                                                        <h1 className="text-3xl font-bold text-gray-900 flex items-center gap-3">
                                                            <Presentation className="w-8 h-8 text-blue-600" />
                                                            Driver Scorecard
                                                        </h1>
                                                        <p className="text-gray-500 mt-2">Data mapped directly to your Presentation requirements.</p>
                                                    </div>
                                                </div>
                                                
                                                <div className="flex flex-col xl:flex-row items-start xl:items-center gap-4 w-full xl:w-auto">
                                                    <div className={`flex flex-col gap-2 p-3 rounded-xl border flex-1 w-full transition-opacity ${viewingPastId ? 'opacity-50 pointer-events-none bg-gray-50 border-gray-200' : 'bg-blue-50/40 border-blue-100'}`}>
                                                        <p className={`text-[10px] font-bold uppercase tracking-wider pl-1 ${viewingPastId ? 'text-gray-500' : 'text-blue-800'}`}>Data Upload</p>
                                                        <div className="flex flex-col sm:flex-row gap-2">
                                                            <label className={`cursor-pointer flex-1 flex items-center justify-center gap-1.5 px-3 py-2 rounded-md text-xs font-bold transition-colors ${scorecardData ? 'bg-green-500 text-white shadow-sm' : 'bg-white text-gray-700 border border-gray-300 hover:bg-gray-50'}`}>
                                                                {scorecardData ? <CheckMark className="w-4 h-4"/> : <UploadCloud className="w-4 h-4 text-gray-400"/>}
                                                                {scorecardData ? "Scorecard Loaded" : "Upload Scorecard"}
                                                                <input key={viewingPastId ? 'past1' : 'new1'} type="file" accept=".xlsx, .csv" onChange={handleMainScorecardUpload} className="hidden" disabled={!xlsxLoaded || !!viewingPastId} />
                                                            </label>
                                                            <label className={`cursor-pointer flex-1 flex items-center justify-center gap-1.5 px-3 py-2 rounded-md text-xs font-bold transition-colors ${assetData ? 'bg-green-500 text-white shadow-sm' : 'bg-white text-gray-700 border border-gray-300 hover:bg-gray-50'}`}>
                                                                {assetData ? <CheckMark className="w-4 h-4"/> : <UploadCloud className="w-4 h-4 text-gray-400"/>}
                                                                {assetData ? "Asset Report Loaded" : "Upload Asset Insp."}
                                                                <input key={viewingPastId ? 'past2' : 'new2'} type="file" accept=".xlsx, .csv" onChange={handleAssetUpload} className="hidden" disabled={!xlsxLoaded || !!viewingPastId} />
                                                            </label>
                                                        </div>
                                                    </div>
                                                    
                                                    <div className="flex flex-col sm:flex-row gap-3 w-full xl:w-auto items-stretch h-full mt-4 xl:mt-0 flex-wrap justify-end">
                                                        {!viewingPastId ? (
                                                            <button 
                                                                onClick={handleSaveScorecard} 
                                                                disabled={!scorecardData}
                                                                className={`flex items-center justify-center gap-2 w-full sm:w-[180px] py-3.5 rounded-xl text-sm font-bold transition-all shadow-sm
                                                                    ${!scorecardData ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-700 text-white hover:shadow-md'}`}
                                                            >
                                                                <Cloud className="w-5 h-5" /> 
                                                                Save to Cloud
                                                            </button>
                                                        ) : (
                                                            <button 
                                                                onClick={handleAddNewScorecard} 
                                                                className={`flex items-center justify-center gap-2 w-full sm:w-[180px] py-3.5 rounded-xl text-sm font-bold transition-all shadow-sm bg-indigo-600 hover:bg-indigo-700 text-white hover:shadow-md`}
                                                            >
                                                                <UploadCloud className="w-5 h-5" /> 
                                                                New Scorecard
                                                            </button>
                                                        )}

                                                        <button 
                                                            onClick={handleExportPDF} 
                                                            disabled={!scorecardData || isExporting}
                                                            className={`flex items-center justify-center gap-2 w-full sm:w-[180px] py-3.5 rounded-xl text-sm font-bold transition-all shadow-sm
                                                                ${(!scorecardData || isExporting) ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-red-600 hover:bg-red-700 text-white hover:shadow-md'}`}
                                                        >
                                                            <FileText className="w-5 h-5" /> 
                                                            {isExporting ? "Exporting..." : "Export PDF"}
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>

                                            {!scorecardData ? (
                                                <div className="text-center py-20 bg-white rounded-2xl shadow-sm border border-gray-100">
                                                    <AlertCircle className="w-16 h-16 text-gray-300 mx-auto mb-4" />
                                                    <h3 className="text-lg font-medium text-gray-900">Waiting for data</h3>
                                                    <p className="text-gray-500">Please upload the Current Driver Safety Scorecard to begin building your slides.</p>
                                                </div>
                                            ) : (
                                                <div id="dashboard-content" className="space-y-8 pb-8 pt-4">
                                                    
                                                    {/* Title Area */}
                                                    {scorecardDateRange && (
                                                        <div className="text-center mt-6 mb-4 px-4 py-6 bg-white border border-gray-200 rounded-2xl shadow-sm">
                                                            <h2 className="text-2xl font-bold text-gray-800 tracking-tight">Driver Safety Scorecard For Period:</h2>
                                                            <div className="mt-2 text-xl font-bold text-blue-600 flex flex-col md:flex-row items-center justify-center gap-1">
                                                                <span>{formatDisplayRange(scorecardDateRange)}</span>
                                                                {trendDateRange && (
                                                                    <span className="text-gray-500 font-semibold text-lg md:ml-2">
                                                                        vs Previous Period: <span className="text-blue-600">{formatDisplayRange(trendDateRange)}</span>
                                                                    </span>
                                                                )}
                                                            </div>

                                                                        <th className="px-4 py-3 text-center border-b bg-gray-50"># Seat belt Occ.</th>
                                                                        <th className="px-4 py-3 text-center border-b bg-gray-50"># DVIR Pre-Trip Missing Occ.</th>
                                                                        <th className="px-4 py-3 text-center rounded-tr-lg border-b bg-gray-50"># DVIR Post-Trip Missing Occ.</th>
                                                                    </tr>
                                                                </thead>
                                                                <tbody className="whitespace-nowrap">
                                                                    {filteredData.map((d, i) => (
                                                                        <tr key={i} className="border-b last:border-0 hover:bg-gray-50">
                                                                            <td className="px-4 py-3">
                                                                                <p className="font-medium text-gray-900">{d.fullName}</p>
                                                                                <p className="text-xs text-gray-500">{d.email}</p>
                                                                            </td>
                                                                            <td className="px-4 py-3">
                                                                                <p className="font-medium text-gray-800">{d.group}</p>
                                                                                <p className="text-xs text-gray-500">{d.region}</p>
                                                                            </td>
                                                                            <td className="px-4 py-3 text-center">
                                                                                <p className="font-medium text-gray-800">{d.distanceMiles.toFixed(2)} mi</p>
                                                                                <p className="text-xs text-gray-500">{d.distanceKm.toFixed(2)} km</p>
                                                                            </td>
                                                                            <td className="px-4 py-3 text-center font-bold text-gray-900 bg-blue-50/30">
                                                                                {d.isActive ? Math.round(d.totalScore) : "-"}
                                                                            </td>
                                                                            <td className="px-4 py-3 text-center font-medium bg-blue-50/30">
                                                                                <span className={`px-2 py-1 rounded-md text-xs ${
                                                                                    d.scoringClass === "Low Risk" ? "bg-green-100 text-green-800" :
                                                                                    d.scoringClass === "Mild Risk" ? "bg-yellow-100 text-yellow-800" :
                                                                                    d.scoringClass === "Medium Risk" ? "bg-orange-100 text-orange-800" :
                                                                                    d.scoringClass === "High Risk" ? "bg-red-100 text-red-800" :
                                                                                    "bg-gray-100 text-gray-800"
                                                                                }`}>
                                                                                    {d.scoringClass}
                                                                                </span>
                                                                            </td>
                                                                            <td className="px-4 py-3 text-center">{d.isActive ? Math.round(d.hardAccel) : "-"}</td>
                                                                            <td className="px-4 py-3 text-center">{d.isActive ? Math.round(d.harshBrake) : "-"}</td>
                                                                            <td className="px-4 py-3 text-center">{d.isActive ? Math.round(d.harshCorner) : "-"}</td>
                                                                            <td className="px-4 py-3 text-center">{d.isActive ? Math.round(d.seatBelt) : "-"}</td>
                                                                            <td className="px-4 py-3 text-center font-medium text-purple-700">{d.isActive ? Math.round(d.preTripMissingScore) : "-"}</td>
                                                                            <td className="px-4 py-3 text-center font-medium text-indigo-700">{d.isActive ? Math.round(d.postTripMissingScore) : "-"}</td>
                                                                            
                                                                            <td className="px-4 py-3 text-center font-bold text-gray-900 bg-gray-100/50">{d.isActive ? d.totalOccurrences : "-"}</td>
                                                                            <td className="px-4 py-3 text-center bg-gray-50/50">{d.isActive ? d.haCount : "-"}</td>
                                                                            <td className="px-4 py-3 text-center bg-gray-50/50">{d.isActive ? d.hbCount : "-"}</td>
                                                                            <td className="px-4 py-3 text-center bg-gray-50/50">{d.isActive ? d.hcCount : "-"}</td>
                                                                            <td className="px-4 py-3 text-center bg-gray-50/50">{d.isActive ? d.sbCount : "-"}</td>
                                                                            <td className="px-4 py-3 text-center bg-gray-50/50">{d.isActive ? d.preMCount : "-"}</td>
                                                                            <td className="px-4 py-3 text-center bg-gray-50/50">{d.isActive ? d.postMCount : "-"}</td>
                                                                        </tr>
                                                                    ))}
                                                                    {filteredData.length === 0 && (
                                                                        <tr>
                                                                            <td colSpan="18" className="px-4 py-8 text-center text-gray-500">
                                                                                No data available for this selection.
                                                                            </td>
                                                                        </tr>
                                                                    )}
                                                                </tbody>
                                                            </table>
                                                        </div>
                                                    </div>

                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </main>
                        </div>

                    </div>
                </div>
            );
        }

        // --- Render the App ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

</body>
</html>
