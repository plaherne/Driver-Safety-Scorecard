<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Safety Dashboard - Presentation View</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin="anonymous" src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin="anonymous" src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (Compiles JSX in the browser) -->
    <script crossorigin="anonymous" src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script>
        // Register a custom Babel preset to enforce the classic JSX runtime
        // This prevents Babel from inserting "react/jsx-runtime" imports
        // and resolves the importSource conflict error.
        Babel.registerPreset('app-preset', {
            presets: [
                [Babel.availablePresets['env'], { modules: false }],
                [Babel.availablePresets['react'], { runtime: 'classic' }]
            ]
        });
    </script>
    
    <!-- SheetJS (Excel Parsing) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" crossorigin="anonymous"></script>

    <!-- HTML2Canvas & jsPDF (For Export PDF functionality) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    
    <div id="root"></div>

    <script type="text/babel" data-presets="app-preset" data-type="module" id="main-app-script">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { useState, useEffect, useMemo, useRef } = React;

        // --- Firebase Initialization ---
        let app, auth, db, appId;
        try {
            // 1. Automatically use the temporary Canvas environment database if running here
            if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                const firebaseConfig = JSON.parse(__firebase_config);
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
            } else {
                // 2. If running externally (e.g., GitHub Pages or emailing the HTML file),
                // it will use YOUR personal database.
                const customFirebaseConfig = {
                    apiKey: "AIzaSyB9U-mjG-vIfeQ_934IHr3b26bEackWmgk",
                    authDomain: "driver-scorecard-creator.firebaseapp.com",
                    projectId: "driver-scorecard-creator",
                    storageBucket: "driver-scorecard-creator.firebasestorage.app",
                    messagingSenderId: "437702559679",
                    appId: "1:437702559679:web:9e8894fbf94ec2712ec30a"
                };
                
                app = initializeApp(customFirebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                appId = "driver-scorecard-creator"; 
            }
        } catch (e) {
            console.error("Firebase config is missing or invalid. App may not sync.");
        }

        // --- SVG Icons (Standalone replacements for lucide-react) ---
        const Icon = ({ path, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {path}
            </svg>
        );
        const UploadCloud = (p) => <Icon {...p} path={<><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></>} />;
        const FileSpreadsheet = (p) => <Icon {...p} path={<><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/></>} />;
        const AlertCircle = (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></>} />;
        const MapIcon = (p) => <Icon {...p} path={<><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></>} />;
        const User = (p) => <Icon {...p} path={<><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>} />;
        const Trophy = (p) => <Icon {...p} path={<><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7c0 6 3 7 6 7s6-1 6-7V2Z"/></>} />;
        const Activity = (p) => <Icon {...p} path={<><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></>} />;
        const AlertTriangle = (p) => <Icon {...p} path={<><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></>} />;
        const Target = (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></>} />;
        const Route = (p) => <Icon {...p} path={<><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></>} />;
        const Presentation = (p) => <Icon {...p} path={<><path d="M2 3h20"/><path d="M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3"/><path d="m7 21 5-5 5 5"/></>} />;
        const Copy = (p) => <Icon {...p} path={<><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></>} />;
        const FilterIcon = (p) => <Icon {...p} path={<><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></>} />;
        const ChevronDown = (p) => <Icon {...p} path={<><path d="m6 9 6 6 6-6"/></>} />;
        const FileText = (p) => <Icon {...p} path={<><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></>} />;
        const Save = (p) => <Icon {...p} path={<><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></>} />;
        const Trash2 = (p) => <Icon {...p} path={<><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></>} />;
        const History = (p) => <Icon {...p} path={<><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></>} />;
        const DownloadIcon = (p) => <Icon {...p} path={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></>} />;
        const UploadIcon = (p) => <Icon {...p} path={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></>} />;
        const LineChartIcon = (p) => <Icon {...p} path={<><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></>} />;
        const ArrowUp = (p) => <Icon {...p} path={<><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></>} />;
        const ArrowDown = (p) => <Icon {...p} path={<><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></>} />;
        const DashboardIcon = (p) => <Icon {...p} path={<><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></>} />;
        const Cloud = (p) => <Icon {...p} path={<><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></>} />;

        // --- Mini Inner Symbols for Risk Icons ---
        const CheckMark = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12"/></svg>;
        const CrossMark = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
        const WarningMark = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>;
        const BlankMark = ({ className }) => <svg viewBox="0 0 24 24" fill="none" className={className}></svg>;

        // --- STATIC HELPERS ---
        const getRegion = (groupStr) => {
            if (!groupStr) return "Unclassified";
            const g = String(groupStr).toUpperCase();
            if (["CLN", "LLA", "ODN", "SGA"].some(s => g.includes(s))) return "EMEA / APAC";
            if (["ASH", "LDC", "FTW", "RPL", "RVA", "TTX", "ZGD", "LDV"].some(s => g.includes(s))) return "Southern";
            if (["BLG", "NAO"].some(s => g.includes(s))) return "Ohio";
            if (["ATN", "BDW", "DKL", "KCM", "PNB", "SNB", "QCR", "RMN", "ZCH"].some(s => g.includes(s))) return "Midwest";
            if (["EAG", "SCU", "UCO", "KND", "MAZ", "ZAZ", "PRN", "CCO", "VLL", "VCN", "GAZ"].some(s => g.includes(s))) return "West";
            return "Unclassified";
        };

        const parseExcelDate = (val) => {
            if (!val) return null;
            if (typeof val === 'number') {
                const dateOnly = Math.floor(val);
                const d = new Date(Math.round((dateOnly - 25569) * 86400 * 1000));
                return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
            }
            const str = String(val).trim().split(' ')[0];
            const parts = str.split('-');
            if (parts.length === 3) {
                return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
            }
            const d = new Date(val);
            return isNaN(d.getTime()) ? null : d;
        };

        const formatDateStr = (dateVal) => {
            const d = parseExcelDate(dateVal);
            if (!d) return String(dateVal);
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            return `${months[d.getMonth()]} ${String(d.getDate()).padStart(2, '0')}, ${d.getFullYear()}`;
        };

        const parseDateRange = (rangeStr) => {
            if (!rangeStr) return null;
            const parts = rangeStr.split(' - ');
            if (parts.length !== 2) return null;
            
            const d1 = new Date(parts[0]);
            const d2 = new Date(parts[1]);
            if (isNaN(d1.getTime()) || isNaN(d2.getTime())) return null;

            const startYear = d1.getFullYear();
            const startMonth = d1.getMonth();
            const startDate = d1.getDate();
            
            const endYear = d2.getFullYear();
            const endMonth = d2.getMonth();
            const endDate = d2.getDate();

            const isFullYear = 
                startDate === 1 && startMonth === 0 &&
                endDate === 31 && endMonth === 11 &&
                startYear === endYear;

            const isFullMonth = 
                !isFullYear &&
                startDate === 1 && 
                startMonth === endMonth &&
                startYear === endYear &&
                endDate === new Date(endYear, endMonth + 1, 0).getDate();

            const isQ1 = startDate === 1 && startMonth === 0 && endDate === 31 && endMonth === 2;
            const isQ2 = startDate === 1 && startMonth === 3 && endDate === 30 && endMonth === 5;
            const isQ3 = startDate === 1 && startMonth === 6 && endDate === 30 && endMonth === 8;
            const isQ4 = startDate === 1 && startMonth === 9 && endDate === 31 && endMonth === 11;
            
            const isQuarter = !isFullYear && (isQ1 || isQ2 || isQ3 || isQ4) && startYear === endYear;
            let quarterNum = 0;
            if (isQ1) quarterNum = 1;
            if (isQ2) quarterNum = 2;
            if (isQ3) quarterNum = 3;
            if (isQ4) quarterNum = 4;

            const type = isFullYear ? 'year' : isQuarter ? 'quarter' : (isFullMonth ? 'month' : 'partial');
            const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            
            return { start: d1, end: d2, type, monthName: months[startMonth], year: startYear, quarterNum };
        };

        const formatDisplayRange = (rangeStr) => {
            const parsed = parseDateRange(rangeStr);
            if (!parsed) return rangeStr;
            if (parsed.type === 'year') return `Year of ${parsed.year}`;
            if (parsed.type === 'quarter') return `Q${parsed.quarterNum} ${parsed.year}`;
            if (parsed.type === 'month') return `Month of ${parsed.monthName} ${parsed.year}`;
            return rangeStr;
        };

        const getPreviousScorecard = (currentRangeStr, savedScorecards, excludeId = null) => {
            const currentParsed = parseDateRange(currentRangeStr);
            if (!currentParsed) return null;
            return savedScorecards.find(sc => {
                if (sc.id === excludeId) return false;
                const parsed = parseDateRange(sc.scorecardDateRange);
                if (!parsed) return false;
                return parsed.type === currentParsed.type && parsed.end.getTime() < currentParsed.start.getTime();
            });
        };

        const mergeData = (scorecardData, assetData) => {
            if (!scorecardData && !assetData) return [];
            
            const allEmails = new Set();
            const scorecardMap = {};

            if (scorecardData) {
                scorecardData.forEach(d => {
                    allEmails.add(d.email);
                    scorecardMap[d.email] = d;
                });
            }
            if (assetData) {
                Object.keys(assetData).forEach(email => allEmails.add(email));
            }

            const result = [];
            allEmails.forEach(email => {
                const sData = scorecardMap[email] || {
                    email: email, group: "Unclassified", region: "Unclassified",
                    distanceKm: 0, distanceMiles: 0, totalScore: 0, scoringClass: "No Activity",
                    totalOccurrences: 0, hardAccel: 0, harshBrake: 0, harshCorner: 0, seatBelt: 0,
                    preTripMissingScore: 0, postTripMissingScore: 0, haCount: 0, hbCount: 0,
                    hcCount: 0, sbCount: 0, preMCount: 0, postMCount: 0, fullName: undefined
                };

                const assetInfo = assetData ? assetData[email] : null;
                let finalGroup = sData.group !== "Unclassified" && sData.group ? sData.group : (assetInfo?.assetSite || "Unclassified");
                let finalAssetSite = assetInfo?.assetSite || finalGroup;

                // Force multi-site drivers into their home sites
                const homeSiteOverrides = {
                    "christopher.mcneely@milestone.tech": "BDW",
                    "dean.williams@milestone.tech": "PRN / CCO"
                };
                
                if (homeSiteOverrides[email]) {
                    finalGroup = homeSiteOverrides[email];
                    finalAssetSite = finalGroup;
                }

                const finalRegion = getRegion(finalGroup);
                const isActive = sData.distanceKm > 0;
                
                let preTrips = assetInfo?.preTrips || 0;
                let postTrips = assetInfo?.postTrips || 0;
                let preTripScore = sData.preTripMissingScore;
                let postTripScore = sData.postTripMissingScore;
                let finalTotalScore = sData.totalScore;
                let finalScoringClass = sData.scoringClass;
                let preMCount = sData.preMCount;
                let postMCount = sData.postMCount;
                let totalOccurrences = sData.totalOccurrences;

                if (assetData && isActive) {
                    preMCount = Math.max(0, postTrips - preTrips);
                    postMCount = Math.max(0, preTrips - postTrips);
                    preTripScore = Math.max(0, 100 - (preMCount * 5));
                    postTripScore = Math.max(0, 100 - (postMCount * 5));
                    
                    finalTotalScore = (
                        (sData.hardAccel * 0.2) + (sData.harshBrake * 0.2) +
                        (sData.harshCorner * 0.2) + (sData.seatBelt * 0.1) +
                        (preTripScore * 0.1) + (postTripScore * 0.2)
                    );

                    if (finalTotalScore >= 95) finalScoringClass = "Low Risk";
                    else if (finalTotalScore >= 80) finalScoringClass = "Mild Risk";
                    else if (finalTotalScore >= 60) finalScoringClass = "Medium Risk";
                    else finalScoringClass = "High Risk";

                    totalOccurrences = sData.haCount + sData.hbCount + sData.hcCount + sData.sbCount + preMCount + postMCount;
                } else if (!isActive) {
                    finalTotalScore = 0; preTripScore = 0; postTripScore = 0; finalScoringClass = "No Activity";
                }

                const baseName = sData.fullName && sData.fullName !== "N/A" ? sData.fullName : email.split('@')[0];
                const determinedFullName = assetInfo?.fullName && assetInfo.fullName !== "" ? assetInfo.fullName : baseName;

                result.push({
                    ...sData, group: finalGroup, region: finalRegion, isActive, 
                    fullName: determinedFullName, assetSite: finalAssetSite, 
                    preTrips, postTrips, preTripMissingScore: preTripScore, postTripMissingScore: postTripScore,
                    totalScore: finalTotalScore, scoringClass: finalScoringClass, preMCount, postMCount, totalOccurrences
                });
            });

            // Clean up group duplicates intelligently
            const groupFreq = {};
            result.forEach(d => {
                if (d.group && d.group !== "Unclassified") {
                    groupFreq[d.group] = (groupFreq[d.group] || 0) + 1;
                }
            });

            const normalizedMap = {}; 
            Object.entries(groupFreq).forEach(([rawName, count]) => {
                const normKey = rawName.toUpperCase().replace(/[-\/\s]/g, '');
                if (!normalizedMap[normKey] || count > normalizedMap[normKey].count) {
                    normalizedMap[normKey] = { rawName, count };
                }
            });

            result.forEach(d => {
                if (d.group && d.group !== "Unclassified") {
                    const normKey = d.group.toUpperCase().replace(/[-\/\s]/g, '');
                    if (normalizedMap[normKey]) {
                        d.group = normalizedMap[normKey].rawName;
                        d.assetSite = normalizedMap[normKey].rawName;
                    }
                }
            });

            return result.filter(d => {
                const grp = String(d.group || "").toUpperCase();
                const site = String(d.assetSite || "").toUpperCase();
                return !grp.includes("COMPANY GROUP") && !site.includes("COMPANY GROUP");
            });
        };

        const getFilteredDataRaw = (mergedData, selectedRegion, selectedSites, selectedDrivers) => {
            let data = selectedRegion === "All" ? [...mergedData] : mergedData.filter(d => d.region === selectedRegion);
            if (selectedSites.length > 0) data = data.filter(d => selectedSites.includes(d.group));
            if (selectedDrivers.length > 0) {
                data = data.filter(d => {
                    const dName = d.fullName && d.fullName !== "N/A" ? d.fullName : d.email.split('@')[0];
                    return selectedDrivers.includes(dName);
                });
            }
            return data.sort((a, b) => {
                if (b.totalScore !== a.totalScore) return b.totalScore - a.totalScore;
                return b.distanceMiles - a.distanceMiles;
            });
        };

        const processScorecardFile = (file, callback, onError) => {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                const bstr = evt.target.result;
                const wb = window.XLSX.read(bstr, { type: 'binary' });
                const sheetName = wb.SheetNames.includes("Report") ? "Report" : wb.SheetNames[0];
                const ws = wb.Sheets[sheetName];
                const data = window.XLSX.utils.sheet_to_json(ws, { header: 1 });

                let fromDate = "";
                let toDate = "";
                for (let i = 0; i < Math.min(30, data.length); i++) {
                    const row = data[i];
                    if (!row) continue;
                    for (let j = 0; j < Math.min(row.length, 5); j++) {
                        const cellVal = String(row[j] || "").trim().toLowerCase().replace(/:/g, '');
                        if (cellVal === "from" || cellVal === "to") {
                            let dateVal = null;
                            for (let k = j + 1; k < Math.min(row.length, j + 5); k++) {
                                if (row[k] !== undefined && row[k] !== null && String(row[k]).trim() !== "") {
                                    dateVal = row[k];
                                    break;
                                }
                            }
                            if (cellVal === "from" && dateVal) fromDate = dateVal;
                            if (cellVal === "to" && dateVal) toDate = dateVal;
                            break;
                        }
                    }
                }

                const rangeString = (fromDate && toDate) ? `${formatDateStr(fromDate)} - ${formatDateStr(toDate)}` : "";

                let headerRowIdx = -1;
                for (let i = 0; i < Math.min(20, data.length); i++) {
                    if (data[i] && data[i].some(c => typeof c === 'string' && c.replace(/\*\*/g, '').trim() === "Group")) {
                        headerRowIdx = i;
                        break;
                    }
                }

                if (headerRowIdx === -1) {
                    if (onError) onError("Could not find 'Group' column in Scorecard.");
                    return;
                }

                const headers = data[headerRowIdx];
                const getCleanIndices = (baseNames) => {
                    const names = Array.isArray(baseNames) ? baseNames : [baseNames];
                    const indices = [];
                    for (let i = 0; i < headers.length; i++) {
                        if (headers[i] === undefined || headers[i] === null) continue;
                        const cleanHeader = String(headers[i]).replace(/\*\*/g, '').trim();
                        if (names.includes(cleanHeader)) indices.push(i);
                    }
                    return indices;
                };

                const ixName = getCleanIndices("Name")[0];
                const ixGroup = getCleanIndices("Group")[0];
                const ixDistKm = getCleanIndices("Distance (km)")[0];
                const ixTotalScore = getCleanIndices("Total Score")[0];
                const ixScoringClass = getCleanIndices(["Scoring Classification", "Score Classification"])[0];
                const ixTotalOccurrences = getCleanIndices(["Total Occurrences", "Total Occurances"])[0];

                const haIndices = getCleanIndices("Hard Acceleration");
                const hbIndices = getCleanIndices("Harsh Braking");
                const hcIndices = getCleanIndices("Harsh Cornering");
                const sbIndices = getCleanIndices("Seat belt");
                const preIndices = getCleanIndices("DVIR Pre-Trip Missing");
                const postIndices = getCleanIndices("DVIR Post-Trip Missing");

                const ixHardAccel = haIndices[0];
                const ixHarshBrake = hbIndices[0];
                const ixHarshCorner = hcIndices[0];
                const ixSeatBelt = sbIndices[0];
                const ixPreTripMissing = preIndices[0];
                const ixPostTripMissing = postIndices[0];

                const ixHardAccelCount = haIndices[1];
                const ixHarshBrakeCount = hbIndices[1];
                const ixHarshCornerCount = hcIndices[1];
                const ixSeatBeltCount = sbIndices[1];
                const ixPreTripCount = preIndices[1];
                const ixPostTripCount = postIndices[1];

                const rows = data.slice(headerRowIdx + 1).filter(r => r[ixName]);

                const processed = rows.map(r => {
                    const groupStr = ixGroup !== undefined && r[ixGroup] ? String(r[ixGroup]).replace("CDL, ", "") : "";
                    const distKm = ixDistKm !== undefined ? parseFloat(r[ixDistKm]) || 0 : 0;
                    return {
                        email: String(r[ixName]).toLowerCase().trim(),
                        group: groupStr,
                        region: getRegion(groupStr),
                        distanceKm: distKm,
                        distanceMiles: distKm * 0.621371,
                        totalScore: ixTotalScore !== undefined ? parseFloat(r[ixTotalScore]) || 0 : 0,
                        scoringClass: ixScoringClass !== undefined && r[ixScoringClass] ? String(r[ixScoringClass]) : "N/A",
                        totalOccurrences: ixTotalOccurrences !== undefined ? parseInt(r[ixTotalOccurrences]) || 0 : 0,
                        hardAccel: ixHardAccel !== undefined ? parseFloat(r[ixHardAccel]) || 0 : 0,
                        harshBrake: ixHarshBrake !== undefined ? parseFloat(r[ixHarshBrake]) || 0 : 0,
                        harshCorner: ixHarshCorner !== undefined ? parseFloat(r[ixHarshCorner]) || 0 : 0,
                        seatBelt: ixSeatBelt !== undefined ? parseFloat(r[ixSeatBelt]) || 0 : 0,
                        preTripMissingScore: ixPreTripMissing !== undefined ? parseFloat(r[ixPreTripMissing]) || 0 : 0,
                        postTripMissingScore: ixPostTripMissing !== undefined ? parseFloat(r[ixPostTripMissing]) || 0 : 0,
                        haCount: ixHardAccelCount !== undefined ? parseInt(r[ixHardAccelCount]) || 0 : 0,
                        hbCount: ixHarshBrakeCount !== undefined ? parseInt(r[ixHarshBrakeCount]) || 0 : 0,
                        hcCount: ixHarshCornerCount !== undefined ? parseInt(r[ixHarshCornerCount]) || 0 : 0,
                        sbCount: ixSeatBeltCount !== undefined ? parseInt(r[ixSeatBeltCount]) || 0 : 0,
                        preMCount: ixPreTripCount !== undefined ? parseInt(r[ixPreTripCount]) || 0 : 0,
                        postMCount: ixPostTripCount !== undefined ? parseInt(r[ixPostTripCount]) || 0 : 0,
                    };
                }).filter(d => {
                    const grp = String(d.group || "").toUpperCase();
                    return !grp.includes("AMZ") && !grp.includes("COMPANY GROUP");
                });

                callback(processed, rangeString);
            };
            reader.readAsBinaryString(file);
        };

        const processAssetFile = (file, callback, onError) => {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                const bstr = evt.target.result;
                const wb = window.XLSX.read(bstr, { type: 'binary' });
                // Fix: Specifically look for the "Report" sheet instead of blindly taking the first one
                const sheetName = wb.SheetNames.includes("Report") ? "Report" : wb.SheetNames[0];
                const ws = wb.Sheets[sheetName];
                const data = window.XLSX.utils.sheet_to_json(ws, { header: 1 });

                let headerRowIdx = -1;
                for (let i = 0; i < Math.min(20, data.length); i++) {
                    if (data[i] && data[i].some(c => typeof c === 'string' && c.replace(/\*\*/g, '').trim() === "First Name")) {
                        headerRowIdx = i;
                        break;
                    }
                }

                if (headerRowIdx === -1) {
                    if (onError) onError("Could not find 'First Name' column in Asset Report.");
                    return;
                }

                const headers = data[headerRowIdx];
                const getCleanIndices = (baseNames) => {
                    const names = Array.isArray(baseNames) ? baseNames : [baseNames];
                    const indices = [];
                    for (let i = 0; i < headers.length; i++) {
                        if (headers[i] === undefined || headers[i] === null) continue;
                        const cleanHeader = String(headers[i]).replace(/\*\*/g, '').trim();
                        if (names.includes(cleanHeader)) indices.push(i);
                    }
                    return indices;
                };
                
                const ixDriver = getCleanIndices("Driver")[0];
                const ixFirst = getCleanIndices("First Name")[0];
                const ixLast = getCleanIndices("Last Name")[0];
                const ixLog = getCleanIndices("Log type")[0];
                const ixDevice = getCleanIndices("Device")[0]; 

                const rows = data.slice(headerRowIdx + 1).filter(r => ixDriver !== undefined && r[ixDriver]);
                const driverMap = {};

                rows.forEach(r => {
                    const email = String(r[ixDriver]).toLowerCase().trim();
                    const firstName = ixFirst !== undefined ? r[ixFirst] || "" : "";
                    const lastName = ixLast !== undefined ? r[ixLast] || "" : "";
                    const logType = ixLog !== undefined ? String(r[ixLog] || "").toLowerCase() : "";
                    
                    const deviceStr = ixDevice !== undefined ? String(r[ixDevice] || "") : "";
                    const assetSite = deviceStr.split("/")[0].trim();

                    if (!driverMap[email]) {
                        driverMap[email] = {
                            fullName: `${firstName} ${lastName}`.trim(),
                            preTrips: 0,
                            postTrips: 0,
                            assetSite: assetSite
                        };
                    }
                    if (assetSite && assetSite !== "undefined") {
                        driverMap[email].assetSite = assetSite;
                    }
                    if (logType === "pretrip") driverMap[email].preTrips++;
                    if (logType === "posttrip") driverMap[email].postTrips++;
                });

                callback(driverMap);
            };
            reader.readAsBinaryString(file);
        };

        // --- CUSTOM DATA HOOKS ---
        function useProcessedData(scorecardData, assetData) {
            return useMemo(() => mergeData(scorecardData, assetData), [scorecardData, assetData]);
        }

        function useFilteredData(mergedData, selectedRegion, selectedSites, selectedDrivers) {
            return useMemo(() => getFilteredDataRaw(mergedData, selectedRegion, selectedSites, selectedDrivers), [mergedData, selectedRegion, selectedSites, selectedDrivers]);
        }

        function extractMetrics(filteredData) {
            if (!filteredData || !filteredData.length) return null;
            let miles = 0, km = 0;
            let scoreSum = 0, haSum = 0, hbSum = 0, hcSum = 0, sbSum = 0, preMSum = 0, postMSum = 0;
            let ruleBreakersTotal = 0;
            let activeCount = 0;

            filteredData.forEach(d => {
                miles += d.distanceMiles;
                km += d.distanceKm;
                if (d.isActive) {
                    scoreSum += d.totalScore; 
                    haSum += d.hardAccel; 
                    hbSum += d.harshBrake;
                    hcSum += d.harshCorner; 
                    sbSum += d.seatBelt; 
                    preMSum += d.preTripMissingScore;
                    postMSum += d.postTripMissingScore;
                    ruleBreakersTotal += d.totalOccurrences;
                    activeCount++;
                }
            });

            const len = activeCount > 0 ? activeCount : 1;
            return {
                totalMiles: Math.round(miles), totalKm: Math.round(km), avgScore: Math.round(scoreSum / len),
                ha: Math.round(haSum / len), hb: Math.round(hbSum / len), hc: Math.round(hcSum / len),
                sb: Math.round(sbSum / len), preM: Math.round(preMSum / len), postM: Math.round(postMSum / len),
                totalRuleBreakers: ruleBreakersTotal
            };
        }

        function useRegionMetrics(filteredData) {
            return useMemo(() => extractMetrics(filteredData), [filteredData]);
        }

        const calculateSiteSummary = (dataToProcess, mode) => {
            const getRAG = (pre, post) => {
                if (pre === 0 || post === 0) return "Red";
                if (Math.abs(pre - post) > 3) return "Red";
                if (pre === post) return "Green";
                return "Amber";
            };
            const calcRatio = (pre, post, isViolation = false) => {
                if (pre === 0 && post === 0) return isViolation ? 0 : 1; 
                if (pre === 0 || post === 0) return 0; 
                return Math.min(pre, post) / Math.max(pre, post);
            };
            const getPercentRAG = (ratio) => {
                if (ratio >= 0.98) return "Green";
                if (ratio >= 0.95) return "Amber";
                return "Red";
            };

            const map = {};
            if(dataToProcess) {
                dataToProcess.forEach(d => {
                    const siteName = d.assetSite;
                    if (!map[siteName]) map[siteName] = { pre: 0, post: 0, distMiles: 0, distKm: 0 };
                    map[siteName].pre += d.preTrips;
                    map[siteName].post += d.postTrips;
                    map[siteName].distMiles += d.distanceMiles;
                    map[siteName].distKm += d.distanceKm;
                });
            }

            let totalPre = 0, totalPost = 0, totalDistMiles = 0, totalDistKm = 0;
            const rows = [];
            
            Object.entries(map).forEach(([site, counts]) => {
                if (counts.pre === 0 && counts.post === 0 && counts.distMiles === 0) return;
                totalPre += counts.pre; totalPost += counts.post; 
                totalDistMiles += counts.distMiles; totalDistKm += counts.distKm;
                
                const violation = counts.pre === 0 && counts.post === 0 && counts.distMiles > 0;
                const ratio = calcRatio(counts.pre, counts.post, violation);
                const activeRag = mode === 'percent' ? getPercentRAG(ratio) : getRAG(counts.pre, counts.post);
                rows.push({ 
                    site, pre: counts.pre, post: counts.post, 
                    distKm: counts.distKm, distMiles: counts.distMiles,
                    ratio, rag: activeRag, violation 
                });
            });

            if (mode === 'percent') {
                rows.sort((a, b) => b.ratio - a.ratio || String(a.site || "").localeCompare(String(b.site || "")));
            } else {
                const ragWeight = { "Green": 1, "Amber": 2, "Red": 3 };
                rows.sort((a, b) => ragWeight[a.rag] - ragWeight[b.rag] || String(a.site || "").localeCompare(String(b.site || "")));
            }
            
            const totalViolation = totalPre === 0 && totalPost === 0 && totalDistMiles > 0;
            const totalRatio = calcRatio(totalPre, totalPost, totalViolation);
            const totalRag = mode === 'percent' ? getPercentRAG(totalRatio) : getRAG(totalPre, totalPost);

            return { rows, totalPre, totalPost, totalDistKm, totalDistMiles, totalRatio, totalRag };
        };

        const FilterBar = ({
            regions, availableSites, availableDrivers,
            selectedRegion, handleRegionChange,
            selectedSites, toggleSite, setSelectedSites,
            selectedDrivers, toggleDriver, setSelectedDrivers,
            activeDriversCount, siteDropdownRef, isSiteDropdownOpen, setIsSiteDropdownOpen,
            driverDropdownRef, isDriverDropdownOpen, setIsDriverDropdownOpen
        }) => {
            return (
                <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center bg-gray-900 p-5 rounded-xl shadow-md text-white gap-6 z-20 relative">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 w-full max-w-4xl">
                        <div className="flex flex-col w-full">
                            <label className="text-gray-400 text-sm font-semibold mb-2 flex items-center gap-2">
                                <MapIcon className="w-4 h-4" /> Select Region:
                            </label>
                            <select 
                                className="bg-gray-800 border border-gray-600 text-white text-base rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2 outline-none font-bold w-full"
                                value={selectedRegion}
                                onChange={handleRegionChange}
                            >
                                {regions.map(r => <option key={r} value={r}>{r}</option>)}
                            </select>
                        </div>

                        <div className="flex flex-col w-full relative" ref={siteDropdownRef}>
                            <label className="text-gray-400 text-sm font-semibold mb-2 flex items-center gap-2">
                                <FilterIcon className="w-4 h-4" /> Choose Site(s):
                            </label>
                            <button 
                                onClick={() => setIsSiteDropdownOpen(!isSiteDropdownOpen)}
                                className="bg-gray-800 border border-gray-600 text-white text-base rounded-lg focus:ring-blue-500 focus:border-blue-500 w-full p-2 outline-none font-bold flex justify-between items-center"
                            >
                                <span className="truncate pr-2">
                                    {selectedSites.length === 0 
                                        ? "All Sites" 
                                        : selectedSites.length === 1 
                                            ? selectedSites[0] 
                                            : `${selectedSites.length} Sites Selected`}
                                </span>
                                <ChevronDown className="w-4 h-4 opacity-70 flex-shrink-0" />
                            </button>

                            {isSiteDropdownOpen && (
                                <div className="absolute z-10 top-full mt-1 left-0 right-0 bg-gray-800 border border-gray-600 rounded-lg p-2 max-h-64 overflow-y-auto space-y-1 shadow-xl">
                                    <label className="flex items-center space-x-3 text-sm text-white cursor-pointer hover:bg-gray-700 px-2 py-1.5 rounded transition-colors">
                                        <input 
                                            type="checkbox" 
                                            checked={selectedSites.length === 0} 
                                            onChange={() => setSelectedSites([])} 
                                            className="rounded w-4 h-4 text-blue-500 focus:ring-blue-500 bg-gray-700 border-gray-500" 
                                        />
                                        <span className="font-medium">All Sites</span>
                                    </label>
                                    {availableSites.map(site => (
                                        <label key={site} className="flex items-center space-x-3 text-sm text-white cursor-pointer hover:bg-gray-700 px-2 py-1.5 rounded transition-colors">
                                            <input 
                                                type="checkbox" 
                                                value={site} 
                                                checked={selectedSites.includes(site)} 
                                                onChange={() => toggleSite(site)} 
                                                className="rounded w-4 h-4 text-blue-500 focus:ring-blue-500 bg-gray-700 border-gray-500" 
                                            />
                                            <span>{site}</span>
                                        </label>
                                    ))}
                                </div>
                            )}
                        </div>

                        <div className="flex flex-col w-full relative" ref={driverDropdownRef}>
                            <label className="text-gray-400 text-sm font-semibold mb-2 flex items-center gap-2">
                                <User className="w-4 h-4" /> Driver:
                            </label>
                            <button 
                                onClick={() => setIsDriverDropdownOpen(!isDriverDropdownOpen)}
                                className="bg-gray-800 border border-gray-600 text-white text-base rounded-lg focus:ring-blue-500 focus:border-blue-500 w-full p-2 outline-none font-bold flex justify-between items-center"
                            >
                                <span className="truncate pr-2">
                                    {selectedDrivers.length === 0 
                                        ? "All Drivers" 
                                        : selectedDrivers.length === 1 
                                            ? selectedDrivers[0] 
                                            : `${selectedDrivers.length} Drivers Selected`}
                                </span>
                                <ChevronDown className="w-4 h-4 opacity-70 flex-shrink-0" />
                            </button>

                            {isDriverDropdownOpen && (
                                <div className="absolute z-10 top-full mt-1 left-0 right-0 bg-gray-800 border border-gray-600 rounded-lg p-2 max-h-64 overflow-y-auto space-y-1 shadow-xl">
                                    <label className="flex items-center space-x-3 text-sm text-white cursor-pointer hover:bg-gray-700 px-2 py-1.5 rounded transition-colors">
                                        <input 
                                            type="checkbox" 
                                            checked={selectedDrivers.length === 0} 
                                            onChange={() => setSelectedDrivers([])} 
                                            className="rounded w-4 h-4 text-blue-500 focus:ring-blue-500 bg-gray-700 border-gray-500" 
                                        />
                                        <span className="font-medium">All Drivers</span>
                                    </label>
                                    {availableDrivers.map(driver => (
                                        <label key={driver} className="flex items-center space-x-3 text-sm text-white cursor-pointer hover:bg-gray-700 px-2 py-1.5 rounded transition-colors">
                                            <input 
                                                type="checkbox" 
                                                value={driver} 
                                                checked={selectedDrivers.includes(driver)} 
                                                onChange={() => toggleDriver(driver)} 
                                                className="rounded w-4 h-4 text-blue-500 focus:ring-blue-500 bg-gray-700 border-gray-500" 
                                            />
                                            <span className="truncate">{driver}</span>
                                        </label>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="text-gray-400 text-sm lg:self-end whitespace-nowrap bg-gray-800 px-4 py-2 rounded-lg border border-gray-700">
                        Showing metrics for <span className="text-white font-bold">{activeDriversCount}</span> active drivers
                    </div>
                </div>
            );
        }

        const InsightsView = ({ 
            savedScorecards, viewingPastId,
            selectedRegion, selectedSites, selectedDrivers
        }) => {
            const [trendPeriod, setTrendPeriod] = useState("Year to Date");

            const maxDate = useMemo(() => {
                if (!savedScorecards || savedScorecards.length === 0) return new Date();
                let max = 0;
                savedScorecards.forEach(sc => {
                    const p = parseDateRange(sc.scorecardDateRange);
                    if (p && p.end.getTime() > max) max = p.end.getTime();
                });
                return new Date(max);
            }, [savedScorecards]);

            const activePeriodScorecards = useMemo(() => {
                if (!savedScorecards || savedScorecards.length === 0) return [];
                const curYear = maxDate.getFullYear();

                let filtered = savedScorecards.filter(sc => {
                    const p = parseDateRange(sc.scorecardDateRange);
                    if (!p) return false;
                    
                    if (trendPeriod === "Rolling Quarters") {
                        return p.type === 'quarter';
                    }
                    
                    if (p.type === 'month' || p.type === 'year' || p.type === 'quarter') return false;

                    const scYear = p.end.getFullYear();

                    if (trendPeriod === "Year to Date") {
                        return scYear === curYear;
                    } 
                    return true; 
                });
                
                if (trendPeriod === "Rolling Quarters") {
                    filtered.sort((a, b) => {
                        const pA = parseDateRange(a.scorecardDateRange);
                        const pB = parseDateRange(b.scorecardDateRange);
                        return pB.end.getTime() - pA.end.getTime();
                    });
                    filtered = filtered.slice(0, 8);
                }
                
                return filtered;
            }, [savedScorecards, trendPeriod, maxDate]);

            const targetScorecard = useMemo(() => {
                if (savedScorecards.length === 0) return null;
                if (viewingPastId) return savedScorecards.find(s => s.id === viewingPastId) || savedScorecards[0];
                return savedScorecards[0];
            }, [savedScorecards, viewingPastId]);

            const prevScorecard = useMemo(() => {
                if (!targetScorecard) return null;
                return getPreviousScorecard(targetScorecard.scorecardDateRange, savedScorecards, targetScorecard.id);
            }, [targetScorecard, savedScorecards]);

            const targetMetrics = useMemo(() => {
                if (!targetScorecard) return null;
                const merged = mergeData(targetScorecard.scorecardData, targetScorecard.assetData);
                const filtered = getFilteredDataRaw(merged, selectedRegion, selectedSites, selectedDrivers);
                return extractMetrics(filtered);
            }, [targetScorecard, selectedRegion, selectedSites, selectedDrivers]);

            const prevMetrics = useMemo(() => {
                if (!prevScorecard) return null;
                const merged = mergeData(prevScorecard.scorecardData, prevScorecard.assetData);
                const filtered = getFilteredDataRaw(merged, selectedRegion, selectedSites, selectedDrivers);
                return extractMetrics(filtered);
            }, [prevScorecard, selectedRegion, selectedSites, selectedDrivers]);

            const { topPerformers, bottomPerformers } = useMemo(() => {
                if (activePeriodScorecards.length === 0) return { topPerformers: [], bottomPerformers: [] };
                
                const driverMap = {};

                activePeriodScorecards.forEach(sc => {
                    const merged = mergeData(sc.scorecardData, sc.assetData);
                    const filtered = getFilteredDataRaw(merged, selectedRegion, selectedSites, selectedDrivers);
                    
                    filtered.forEach(d => {
                        if (!d.isActive) return;
                        
                        if (!driverMap[d.email]) {
                            driverMap[d.email] = {
                                email: d.email,
                                fullName: d.fullName,
                                group: d.group,
                                distanceMiles: 0,
                                distanceKm: 0,
                                totalOccurrences: 0,
                                scoreSum: 0,
                                scoreCount: 0
                            };
                        }
                        
                        driverMap[d.email].distanceMiles += d.distanceMiles;
                        driverMap[d.email].distanceKm += d.distanceKm;
                        driverMap[d.email].scoreSum += d.totalScore;
                        driverMap[d.email].scoreCount++;
                    });
                });

                const finalDrivers = Object.values(driverMap).map(d => ({
                    ...d,
                    totalScore: d.scoreSum / d.scoreCount
                }));

                const sortedDesc = [...finalDrivers].sort((a, b) => b.totalScore - a.totalScore);
                const sortedAsc = [...finalDrivers].sort((a, b) => a.totalScore - b.totalScore);
                
                return {
                    topPerformers: sortedDesc.slice(0, 5),
                    bottomPerformers: sortedAsc.slice(0, 5)
                };
            }, [activePeriodScorecards, selectedRegion, selectedSites, selectedDrivers]);

            const trendDataPoints = useMemo(() => {
                if (activePeriodScorecards.length === 0) return [];
                
                const groupedByPeriod = {};
                activePeriodScorecards.forEach(sc => {
                    const p = parseDateRange(sc.scorecardDateRange);
                    if (!p) return;
                    
                    let periodKey, label, timestamp;
                    
                    if (trendPeriod === "Rolling Quarters" && p.type === 'quarter') {
                        periodKey = `${p.year}-Q${p.quarterNum}`;
                        label = `Q${p.quarterNum} ${p.year}`;
                        timestamp = p.end.getTime();
                    } else {
                        const year = p.start.getFullYear();
                        const month = p.start.getMonth();
                        periodKey = `${year}-${String(month).padStart(2, '0')}`;
                        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
                        label = `${months[month]} ${year}`;
                        timestamp = new Date(year, month, 1).getTime();
                    }
                    
                    if (!groupedByPeriod[periodKey]) {
                        groupedByPeriod[periodKey] = {
                            key: periodKey,
                            label: label,
                            timestamp: timestamp,
                            scorecards: []
                        };
                    }
                    groupedByPeriod[periodKey].scorecards.push(sc);
                });

                const points = Object.values(groupedByPeriod).map(group => {
                    let totalAvgScore = 0;
                    let totalRuleBreakers = 0;
                    let totalMiles = 0;
                    let validCount = 0;

                    group.scorecards.forEach(sc => {
                        const merged = mergeData(sc.scorecardData, sc.assetData);
                        const dataToMetric = getFilteredDataRaw(merged, selectedRegion, selectedSites, selectedDrivers);
                        const m = extractMetrics(dataToMetric);
                        if (m) {
                            totalAvgScore += m.avgScore;
                            totalRuleBreakers += m.totalRuleBreakers;
                            totalMiles += m.totalMiles;
                            validCount++;
                        }
                    });

                    return {
                        label: group.label,
                        timestamp: group.timestamp,
                        avgScore: validCount > 0 ? Math.round(totalAvgScore / validCount) : 0,
                        ruleBreakers: totalRuleBreakers,
                        totalMiles: totalMiles
                    };
                });

                points.sort((a, b) => a.timestamp - b.timestamp);
                return points;
            }, [activePeriodScorecards, selectedRegion, selectedSites, selectedDrivers, trendPeriod]);

            const aggregateMetrics = useMemo(() => {
                if (trendDataPoints.length === 0) return { avgScore: 0, totalRuleBreakers: 0, totalMiles: 0 };
                let sumScore = 0, sumRb = 0, sumMiles = 0;
                trendDataPoints.forEach(d => {
                    sumScore += d.avgScore;
                    sumRb += d.ruleBreakers;
                    sumMiles += d.totalMiles;
                });
                return {
                    avgScore: Math.round(sumScore / trendDataPoints.length),
                    totalRuleBreakers: sumRb,
                    totalMiles: sumMiles
                };
            }, [trendDataPoints]);

            if (trendDataPoints.length === 0 && savedScorecards.length === 0) {
                return (
                    <div className="text-center py-20 bg-white rounded-2xl shadow-sm border border-gray-100 mt-6">
                        <LineChartIcon className="w-16 h-16 text-gray-300 mx-auto mb-4" />
                        <h3 className="text-lg font-medium text-gray-900">No Insights Available</h3>
                        <p className="text-gray-500">Save some scorecards to your history to unlock trends and insights.</p>
                    </div>
                );
            }

            const yAxisMaxRb = Math.max(...trendDataPoints.map(d => d.ruleBreakers), 4);

            const svgPointsScore = trendDataPoints.map((d, i) => {
                const x = trendDataPoints.length === 1 ? 50 : (i / (trendDataPoints.length - 1)) * 100;
                const y = 100 - d.avgScore; 
                return `${x},${y}`;
            }).join(' ');

            const svgPointsRb = trendDataPoints.map((d, i) => {
                const x = trendDataPoints.length === 1 ? 50 : (i / (trendDataPoints.length - 1)) * 100;
                const y = 100 - (d.ruleBreakers / yAxisMaxRb) * 100;
                return `${x},${y}`;
            }).join(' ');

            return (
                <div className="space-y-8 animate-in fade-in duration-300 pb-10 mt-6">
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mt-2">
                        <div className="mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center">
                            <div>
                                <h2 className="text-2xl font-bold text-gray-900 flex items-center gap-2">
                                    <LineChartIcon className="w-6 h-6 text-indigo-600" /> Rolling Trends & Metrics
                                </h2>
                                <p className="text-sm text-gray-500 mt-1">Showing aggregated data for: <strong className="text-indigo-700">{trendPeriod}</strong></p>
                            </div>
                            <div className="mt-4 sm:mt-0 flex items-center">
                                <label className="text-xs font-bold text-gray-500 uppercase tracking-wider mr-3">Time Period:</label>
                                <select 
                                    className="bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block p-2.5 outline-none font-bold shadow-sm"
                                    value={trendPeriod}
                                    onChange={(e) => setTrendPeriod(e.target.value)}
                                >
                                    <option value="All">All Time (Bi-Weekly)</option>
                                    <option value="Year to Date">Year to Date (Bi-Weekly)</option>
                                    <option value="Rolling Quarters">Rolling Quarters (Last 8)</option>
                                </select>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                            <div className="p-5 rounded-xl border border-gray-100 bg-gray-50">
                                <p className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Avg Fleet Score</p>
                                <div className="flex items-end mt-2">
                                    <span className="text-3xl font-black text-gray-900">{aggregateMetrics.avgScore}%</span>
                                </div>
                            </div>
                            
                            <div className="p-5 rounded-xl border border-gray-100 bg-gray-50">
                                <p className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Total Rule Breakers</p>
                                <div className="flex items-end mt-2">
                                    <span className="text-3xl font-black text-gray-900">{aggregateMetrics.totalRuleBreakers}</span>
                                </div>
                            </div>

                            <div className="p-5 rounded-xl border border-gray-100 bg-gray-50">
                                <p className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Total Miles Driven</p>
                                <div className="flex items-end mt-2">
                                    <span className="text-3xl font-black text-gray-900">{aggregateMetrics.totalMiles}</span>
                                </div>
                            </div>
                        </div>

                        {trendDataPoints.length === 0 ? (
                             <div className="text-center py-10 bg-gray-50 rounded-xl border border-gray-100 border-dashed">
                                 <p className="text-gray-500 font-medium">No scorecards saved within this specific time period.</p>
                             </div>
                        ) : (
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-10">
                                {/* Rule Breakers Line Chart */}
                                <div className="bg-gray-50 rounded-xl p-5 border border-gray-100 flex flex-col h-72">
                                    <h4 className="text-xs font-black text-gray-400 uppercase tracking-wider mb-2 text-center">Total Rule Breakers (Occurrences)</h4>
                                    <div className="relative flex-1">
                                        <svg className="w-full h-full" viewBox="0 0 100 100" preserveAspectRatio="none">
                                            <polyline fill="none" stroke="#6366f1" strokeWidth="2" points={svgPointsRb} />
                                        </svg>
                                    </div>
                                </div>

                                {/* Avg Score Line Chart */}
                                <div className="bg-gray-50 rounded-xl p-5 border border-gray-100 flex flex-col h-72">
                                    <h4 className="text-xs font-black text-gray-400 uppercase tracking-wider mb-2 text-center">Average Fleet Score (%)</h4>
                                    <div className="relative flex-1">
                                        <svg className="w-full h-full" viewBox="0 0 100 100" preserveAspectRatio="none">
                                            <polyline fill="none" stroke="#4f46e5" strokeWidth="2" points={svgPointsScore} />
                                        </svg>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Top & Bottom Performers */}
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mt-6">
                        <div className="mb-6">
                            <h2 className="text-2xl font-bold text-gray-900 flex items-center gap-2">
                                <Trophy className="w-6 h-6 text-yellow-500" /> Top & Bottom Performers
                            </h2>
                            <p className="text-sm text-gray-500 mt-1">Aggregated data based on the selected time period: <strong className="text-indigo-700">{trendPeriod}</strong></p>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-10">
                            {/* Top Performers */}
                            <div className="p-5 rounded-xl border border-gray-100 bg-gray-50">
                                <h3 className="text-lg font-bold text-gray-800 mb-4">Top 5 Performers</h3>
                                <div className="space-y-4">
                                    {topPerformers.map((d, i) => (
                                        <div key={d.email} className="flex justify-between items-center p-3 bg-white rounded-lg shadow-xs">
                                            <div className="flex items-center gap-3">
                                                <span className="font-bold text-yellow-500">#{i+1}</span>
                                                <div>
                                                    <p className="font-semibold text-gray-900">{d.fullName}</p>
                                                    <p className="text-xs text-gray-500">{d.group}</p>
                                                </div>
                                            </div>
                                            <span className="font-bold text-gray-900 bg-green-50 text-green-700 px-3 py-1 rounded-full">{Math.round(d.totalScore)}%</span>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Bottom Performers */}
                            <div className="p-5 rounded-xl border border-gray-100 bg-gray-50">
                                <h3 className="text-lg font-bold text-gray-800 mb-4">Underperforming Drivers</h3>
                                <div className="space-y-4">
                                    {bottomPerformers.map((d, i) => (
                                        <div key={d.email} className="flex justify-between items-center p-3 bg-white rounded-lg shadow-xs">
                                            <div className="flex items-center gap-3">
                                                <span className="font-bold text-red-500">#{i+1}</span>
                                                <div>
                                                    <p className="font-semibold text-gray-900">{d.fullName}</p>
                                                    <p className="text-xs text-gray-500">{d.group}</p>
                                                </div>
                                            </div>
                                            <span className="font-bold text-gray-900 bg-red-50 text-red-700 px-3 py-1 rounded-full">{Math.round(d.totalScore)}%</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- RENDER COMPONENTS ---
        const getRiskProps = (scoreValue) => {
            const s = Number(scoreValue);
            if (s >= 95) return { colorClass: "bg-green-500", iconColorClass: "text-white", icon: CheckMark };
            if (s >= 80) return { colorClass: "bg-yellow-400", iconColorClass: "text-yellow-900", icon: WarningMark };
            if (s >= 60) return { colorClass: "bg-orange-500", iconColorClass: "text-white", icon: BlankMark };
            return { colorClass: "bg-red-500", iconColorClass: "text-white", icon: CrossMark };
        };

        const RiskCircle = ({ type, sizeClass = "w-4 h-4", iconClass = "w-2.5 h-2.5" }) => {
            if (type === "Low Risk") return <span className={`flex items-center justify-center rounded-full bg-green-500 shadow-sm flex-shrink-0 ${sizeClass}`}><CheckMark className={`text-white ${iconClass}`} /></span>;
            if (type === "Mild Risk") return <span className={`flex items-center justify-center rounded-full bg-yellow-400 shadow-sm flex-shrink-0 ${sizeClass}`}><WarningMark className={`text-yellow-900 ${iconClass}`} /></span>;
            if (type === "Medium Risk") return <span className={`rounded-full bg-orange-500 shadow-sm flex-shrink-0 ${sizeClass}`}></span>;
            if (type === "High Risk") return <span className={`flex items-center justify-center rounded-full bg-red-500 shadow-sm flex-shrink-0 ${sizeClass}`}><CrossMark className={`text-white ${iconClass}`} /></span>;
            return null;
        };

        const ScorePieChartCard = ({ score, riskCounts, total, trendScore }) => {
            const radius = 38; 
            const strokeWidth = 24; 
            const circumference = 2 * Math.PI * radius;
            const scoreValue = Math.max(0, Math.min(100, score || 0));
            
            let currentOffset = 0;
            const segments = [
                { key: 'Low Risk', color: '#22c55e', count: riskCounts['Low Risk'] || 0 },     
                { key: 'Mild Risk', color: '#facc15', count: riskCounts['Mild Risk'] || 0 },   
                { key: 'Medium Risk', color: '#f97316', count: riskCounts['Medium Risk'] || 0 }, 
                { key: 'High Risk', color: '#ef4444', count: riskCounts['High Risk'] || 0 },     
            ];

            let trendColor = "text-gray-600 bg-gray-100";
            let trendIcon = "";
            if (trendScore !== undefined && trendScore !== null) {
                if (trendScore > 0) {
                    trendIcon = "▲"; trendColor = "text-green-700 bg-green-100 border border-green-200";
                } else if (trendScore < 0) {
                    trendIcon = "▼"; trendColor = "text-red-700 bg-red-100 border border-red-200";
                } else {
                    trendIcon = "-";
                }
            }

            return (
                <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5 flex flex-col justify-between h-full relative">
                    <div className="flex justify-between items-center mb-2 border-b pb-2">
                        <h3 className="text-sm font-semibold text-gray-500 uppercase tracking-wider">Avg Total Score</h3>
                        {trendScore !== undefined && trendScore !== null && (
                            <div className={`px-2 py-1 rounded-md text-sm font-black flex items-center gap-1 ${trendColor}`}>
                                <span>{trendIcon}</span><span>{Math.abs(trendScore)}</span>
                            </div>
                        )}
                    </div>
                    
                    <div id="score-pie-chart-container" className="flex flex-col items-center justify-center flex-1 bg-white p-2 w-full">
                        <div className="flex flex-col items-center justify-center flex-1 py-2 w-full">
                            <div className="relative w-36 h-36 flex items-center justify-center">
                                <svg className="absolute w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                                    {total === 0 ? (
                                        <circle cx="50" cy="50" r={radius} fill="transparent" stroke="#e5e7eb" strokeWidth={strokeWidth} />
                                    ) : (
                                        segments.map((seg) => {
                                            if (seg.count === 0) return null;
                                            const length = (seg.count / total) * circumference;
                                            const offset = currentOffset;
                                            
                                            const midProportion = (currentOffset + length / 2) / circumference;
                                            const angle = midProportion * 2 * Math.PI;
                                            const textX = 50 + radius * Math.cos(angle);
                                            const textY = 50 + radius * Math.sin(angle);
                                            const percentage = Math.round((seg.count / total) * 100);

                                            currentOffset += length;
                                            
                                            return (
                                                <g key={seg.key}>
                                                    <circle cx="50" cy="50" r={radius} fill="transparent" stroke={seg.color} strokeWidth={strokeWidth} strokeDasharray={`${length} ${circumference}`} strokeDashoffset={-offset} className="transition-all duration-1000 ease-out" />
                                                    {percentage > 3 && (
                                                        <text x={textX} y={textY} fill={seg.key === 'Mild Risk' ? '#854d0e' : '#ffffff'} fontSize="7.5" fontWeight="bold" textAnchor="middle" dominantBaseline="central" transform={`rotate(90 ${textX} ${textY})`}>
                                                            {percentage}%
                                                        </text>
                                                    )}
                                                </g>
                                            );
                                        })
                                    )}
                                </svg>
                                <div className="text-3xl font-bold text-gray-900 z-10">{scoreValue}%</div>
                            </div>
                        </div>

                        <div className="flex flex-wrap justify-center gap-x-3 gap-y-1 text-[11px] font-medium text-gray-600 mt-2 border-t border-gray-100 pt-3 w-full">
                            {segments.map(seg => (
                                <div key={seg.key} className="flex items-center gap-1.5">
                                    <RiskCircle type={seg.key} sizeClass="w-3.5 h-3.5" iconClass="w-2 h-2" />
                                    {seg.key}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const MetricCard = ({ title, value, subtext, icon: IconComponent, colorClass, iconColorClass = "text-white", trendValue, trendType = "higher-is-better", isDark = false }) => {
            let trendColor = isDark ? "text-gray-400 bg-gray-800" : "text-gray-600 bg-gray-100";
            let trendIcon = "";
            if (trendValue !== undefined && trendValue !== null) {
                if (trendValue > 0) {
                    trendIcon = "▲";
                    if (trendType === "higher-is-better") trendColor = isDark ? "text-green-400 bg-green-900/40 border border-green-800" : "text-green-700 bg-green-100 border border-green-200";
                    else if (trendType === "lower-is-better") trendColor = isDark ? "text-red-400 bg-red-900/40 border border-red-800" : "text-red-700 bg-red-100 border border-red-200";
                    else trendColor = isDark ? "text-blue-400 bg-blue-900/40 border border-blue-800" : "text-blue-700 bg-blue-100 border border-blue-200";
                } else if (trendValue < 0) {
                    trendIcon = "▼";
                    if (trendType === "higher-is-better") trendColor = isDark ? "text-red-400 bg-red-900/40 border border-red-800" : "text-red-700 bg-red-100 border border-red-200";
                    else if (trendType === "lower-is-better") trendColor = isDark ? "text-green-400 bg-green-900/40 border border-green-800" : "text-green-700 bg-green-100 border border-green-200";
                    else trendColor = isDark ? "text-blue-400 bg-blue-900/40 border border-blue-800" : "text-blue-700 bg-blue-100 border border-blue-200";
                } else {
                    trendIcon = "-";
                }
            }

            return (
                <div className={`${isDark ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-100'} rounded-xl shadow-sm border p-5 flex items-center space-x-4`}>
                    <div className={`w-12 h-12 rounded-full flex flex-shrink-0 items-center justify-center ${colorClass}`}>
                        <IconComponent className={`w-6 h-6 ${iconColorClass}`} />
                    </div>
                    <div className="flex-1">
                        <p className={`text-[11px] font-bold uppercase tracking-wider ${isDark ? 'text-gray-400' : 'text-gray-500'}`}>{title}</p>
                        <div className="flex justify-between items-end mt-1">
                            <p className={`text-2xl font-black ${isDark ? 'text-white' : 'text-gray-900'}`}>{value}</p>
                            {trendValue !== undefined && trendValue !== null && (
                                <div className={`px-2 py-1 rounded-md text-sm font-black flex items-center gap-1 ${trendColor}`}>
                                    <span>{trendIcon}</span>
                                    <span>{Math.abs(trendValue)}</span>
                                </div>
                            )}
                        </div>
                        {subtext && <p className={`text-[10px] mt-1 ${isDark ? 'text-gray-500' : 'text-gray-400'}`}>{subtext}</p>}
                    </div>
                </div>
            );
        };

        // --- Main App Component ---
        function App() {
            const [activeView, setActiveView] = useState("dashboard");
            const [xlsxLoaded, setXlsxLoaded] = useState(false);
            const [isExporting, setIsExporting] = useState(false);
            
            // Firebase Cloud state
            const [user, setUser] = useState(null);
            const [loadingFirebase, setLoadingFirebase] = useState(true);
            const [toast, setToast] = useState(null);
            const [confirmDialog, setConfirmDialog] = useState(null);

            // Current Data
            const [scorecardData, setScorecardData] = useState(null);
            const [assetData, setAssetData] = useState(null);
            const [scorecardDateRange, setScorecardDateRange] = useState("");
            
            // Trend Data
            const [trendScorecardData, setTrendScorecardData] = useState(null);
            const [trendAssetData, setTrendAssetData] = useState(null);
            const [trendDateRange, setTrendDateRange] = useState("");

            // Saved Scorecards Data
            const [savedScorecards, setSavedScorecards] = useState([]);

            // Filters
            const [selectedRegion, setSelectedRegion] = useState("All");
            const [selectedSites, setSelectedSites] = useState([]); 
            const [isSiteDropdownOpen, setIsSiteDropdownOpen] = useState(false);
            const siteDropdownRef = useRef(null);

            const [selectedDrivers, setSelectedDrivers] = useState([]); 
            const [isDriverDropdownOpen, setIsDriverDropdownOpen] = useState(false);
            const driverDropdownRef = useRef(null);

            const [ragMode, setRagMode] = useState("percent"); 
            const [viewingPastId, setViewingPastId] = useState(null);

            const showToast = (message, type = "success") => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 4000);
            };

            // Auth Hook
            useEffect(() => {
                if (!auth) {
                    setLoadingFirebase(false);
                    return;
                }
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (e) {
                        console.error("Auth error", e);
                    }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                    setLoadingFirebase(false);
                });
                return () => unsubscribe();
            }, []);

            // Data Fetching Hook
            useEffect(() => {
                if (!user || !db) return;
                
                const scorecardsRef = collection(db, 'artifacts', appId, 'public', 'data', 'scorecards');
                const unsubscribe = onSnapshot(scorecardsRef, (snapshot) => {
                    const cards = [];
                    snapshot.forEach(d => {
                        cards.push({ id: d.id, ...d.data() });
                    });
                    cards.sort((a, b) => {
